[Network]
UDPPort=4242

[Sensitivity]
YawMultiplier=1.0
PitchMultiplier=1.0
RollMultiplier=1.0
InvertYaw=false
InvertPitch=false
InvertRoll=false

[Smoothing]
; Picked per connection from the packet source address; covers rotation and
; position. 0.0 = none, 1.0 = heaviest (10s time constant).
; Tracker running on this machine (loopback).
LocalSmoothing=0.0
; Tracker on a remote device on the network.
RemoteSmoothing=0.15

[Position]
Enabled=true
SensitivityX=1.0
SensitivityY=1.0
SensitivityZ=1.0
LimitX=0.30
LimitY=0.20
; Downward travel. Defaults to LimitY, so vertical stays symmetric unless you
; set it lower for a tighter crouch range.
LimitYDown=0.20
LimitZ=0.40
LimitZBack=0.10
InvertX=false
InvertY=false
; InvertZ is for a tracker that sends depth backwards, not for a lean that
; feels reversed. It is applied before the LimitZ / LimitZBack clamp, so
; turning it on also swaps the travel budgets to 0.10m forward and 0.40m back.
InvertZ=false

[Reticle]
; Head tracking moves the view off the gun, so the crosshair NMS draws in the
; middle of the frame stops marking where the shot goes. On, the crosshair is
; moved onto the shot instead. Off restores the stock one.
FollowAim=true

[Hotkeys]
; Virtual key codes (hex). End=0x23, PageUp=0x21.
; Ctrl+Shift+Y/G chord alternatives are also registered.
ToggleKey=0x23
; Cycles rotation+position -> rotation only -> position only -> back.
CycleModeKey=0x21

[General]
AutoEnable=true
LogToFile=true

[Debug]
; Engine-discovery detail in the log. Turn on when filing a bug report.
Diagnostics=false
; ReadWatch and WriteWatch share one CPU debug register, so only the first of
; the two to start is armed; the other says so in the log and stands down.
ReadWatch=false
WriteWatch=false
; Locates the first-person weapon transform so it can be held to the body
; rather than swinging with the head. One-shot report, then idle.
WeaponProbe=false
; Holds each engine camera global CLEAN in turn to find which one places the
; view-space viewmodel. Diagnostic only.
CleanGlobalCycle=false
; Hunts for the HUD crosshair screen position in memory. Diagnostic only.
CrosshairProbe=false
; Walks the crosshair around a fixed square instead of following the aim, to
; tell "the reticle does not move" apart from "it moves to the wrong place".
ReticleSweep=false
