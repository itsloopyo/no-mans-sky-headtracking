[Network]
UDPPort=4242

[Sensitivity]
YawMultiplier=1
PitchMultiplier=1
RollMultiplier=1
InvertYaw=0
InvertPitch=0
InvertRoll=0

[Smoothing]
;  Picked per connection from the packet source address; covers rotation and position.
;  Tracker running on this machine (loopback). 0 = none, 1 = heavy.
LocalSmoothing=0
;  Tracker on a remote device on the network. 0 = none, 1 = heavy.
RemoteSmoothing=0.15

[Position]
Enabled=1
SensitivityX=1
SensitivityY=1
SensitivityZ=1
LimitX=0.3
LimitY=0.2
LimitYDown=0.2
LimitZ=0.4
LimitZBack=0.1
InvertX=0
InvertY=0
InvertZ=0

[Reticle]
;  Head tracking moves the view off the gun, so the crosshair NMS draws in
;  the middle of the frame stops marking where the shot goes. On, the
;  crosshair is moved onto the shot instead. Off restores the stock one.
FollowAim=1

[ADS]
;  What head tracking does while the sights are up. Cycled in game with
;  Insert or Ctrl+Shift+U, which writes the new value back here.
;    paused  - tracking stands down for as long as the sights are up.
;    marker  - tracking stays live and an aim marker is drawn.
;    tracked - tracking stays live, nothing drawn.
;  This build does not yet know when your sights are up, and draws no
;  marker, so all three modes currently behave the same. The missing
;  weapon-zoom address is named in the log.
Mode=paused

[Hotkeys]
ToggleKey=0x23
CycleModeKey=0x21
AdsModeKey=0x2D

[General]
AutoEnable=1
LogToFile=1

[Debug]
;  Engine-discovery detail in the log. Turn on for a bug report.
Diagnostics=0
;  Log which instructions read the live camera transform, using a CPU
;  data breakpoint. Makes the game crawl while each burst is armed.
;  ReadWatch and WriteWatch share one debug register; only one runs.
ReadWatch=0
;  Serves the clean camera to one candidate caller at a time,
;  cycling every few seconds, and logs each one. For finding
;  which consumer aims something that is aiming wrongly.
AimCallerSweep=0
;  The same sweep inverted: serves the TRACKED camera to one
;  candidate at a time, for finding what decides visibility.
CullCallerSweep=0
CallerCensus=0
LiveCallerOverrides=0
WriteWatch=0
WeaponProbe=0
CleanGlobalCycle=0
CrosshairProbe=0
;  Walks the crosshair around a fixed square instead of following the aim.
ReticleSweep=0
