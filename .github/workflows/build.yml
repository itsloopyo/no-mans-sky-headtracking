name: Build

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

jobs:
  build:
    name: Build and package
    runs-on: windows-latest
    timeout-minutes: 30
    if: ${{ !startsWith(github.event.head_commit.message, 'Release v') }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive

      # C++ toolchain for the pixi `package` task's cmake/msbuild build.
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      # run-install: false - this workspace has zero conda dependencies (pixi is
      # a task runner only; CMake and MSVC come from the runner image). The
      # action's post-install `pixi list` errors on an empty environment in
      # pixi 0.70+.
      - name: Setup pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          run-install: false

      # Nothing in CI ran the suite before this: the build compiles the five test
      # executables as part of the ALL target but never executes them, so a
      # regression in the camera composition, the ADS pipeline, the state gate or
      # the config boundary merged green. Before packaging, so a failing test
      # does not cost a full package first.
      - name: Test
        shell: pwsh
        run: pixi run test-release

      # Build + package through the SAME command a developer runs locally. All
      # build logic lives in the pixi task chain (setup -> build-release ->
      # package); the workflow owns none, so local and CI can't drift.
      - name: Build and package
        shell: pwsh
        run: pixi run package

      - name: Verify installer was produced
        shell: pwsh
        run: |
          $zip = Get-ChildItem release/*-installer.zip -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $zip) {
            Write-Host "::error::No installer ZIP was produced by 'pixi run package'"
            exit 1
          }
